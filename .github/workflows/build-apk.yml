name: Build APK

# Unpacks project-v2.3.zip from the repo root and builds the APK from it,
# so nothing but that one zip has to be uploaded. Handy when uploading from
# a phone, where GitHub's web UI cannot upload folders.
on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Unpack project zip
        run: |
          ZIP=$(ls *.zip | head -n 1)
          echo "Unpacking $ZIP"
          mkdir -p src
          unzip -q -o "$ZIP" -d src
          # If the zip wrapped everything in a single folder, lift it out.
          if [ ! -f src/settings.gradle.kts ]; then
            INNER=$(find src -maxdepth 2 -name settings.gradle.kts | head -n 1)
            if [ -n "$INNER" ]; then
              mv "$(dirname "$INNER")" src_lifted
              rm -rf src
              mv src_lifted src
            fi
          fi
          echo "--- project root ---"
          ls -la src

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: ''       # skip the default (obsolete) package list that breaks the build

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Accept SDK licenses
        run: yes | sdkmanager --licenses || true

      - name: Build debug APK
        working-directory: src
        run: gradle assembleDebug --stacktrace --no-daemon

      - name: Rename APK
        run: |
          mkdir -p out
          cp src/app/build/outputs/apk/debug/app-debug.apk out/ArmanLaws-v2.3.apk
          ls -lh out/

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: ArmanLaws-v2.3-APK
          path: out/ArmanLaws-v2.3.apk
          if-no-files-found: error
